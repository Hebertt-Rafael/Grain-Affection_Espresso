<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Entrar — Grain &amp; Affection', 'Acesse sua conta de Cliente ou Gerente na cafeteria Grain &amp; Affection.')}"></head>

<body data-page="login">

  <header th:replace="~{fragments :: header('login')}"></header>

  <main>
    <section class="section section-dark" style="padding: 4rem 0 3rem; text-align: center;">
      <div class="container reveal-on-scroll">
        <span class="subtitle-french" style="font-size: 3rem;">Bem-vindo de volta</span>
        <h1>Entrar na sua Conta</h1>
        <div class="line-decoration"></div>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width: 540px;">
        <th:block th:replace="~{fragments :: mensagens}"></th:block>

        <div class="form-card">
          <form th:action="@{/login}" th:object="${loginDto}" method="post">
            <div class="form-group">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" id="email" class="form-control" th:field="*{email}" placeholder="voce@exemplo.com"
                required autofocus>
            </div>
            <div class="form-group">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" id="senha" class="form-control" th:field="*{senha}" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1.1rem;">Entrar</button>
          </form>
          <p style="text-align: center; margin-top: 1.5rem;">
            Ainda não tem conta? <a th:href="@{/cadastro}" style="color: var(--color-forest); font-weight: 700;">Cadastre-se gratuitamente</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer th:replace="~{fragments :: footer}"></footer>
  <th:block th:replace="~{fragments :: scripts}"></th:block>
</body>

</html>
