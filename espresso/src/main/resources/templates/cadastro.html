<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Cadastro — Grain &amp; Affection', 'Crie sua conta para fazer pedidos online na cafeteria Grain &amp; Affection.')}"></head>

<body data-page="cadastro">

  <header th:replace="~{fragments :: header('login')}"></header>

  <main>
    <section class="section section-dark" style="padding: 4rem 0 3rem; text-align: center;">
      <div class="container reveal-on-scroll">
        <span class="subtitle-french" style="font-size: 3rem;">Rejoignez-nous</span>
        <h1>Criar Conta</h1>
        <div class="line-decoration"></div>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width: 620px;">
        <th:block th:replace="~{fragments :: mensagens}"></th:block>

        <div class="form-card">
          <form th:action="@{/cadastro}" th:object="${cadastroDto}" method="post">
            <div class="form-group">
              <label for="nome" class="form-label">Nome Completo</label>
              <input type="text" id="nome" class="form-control" th:field="*{nome}" placeholder="Ex: Claire Dubois"
                required>
            </div>
            <div class="form-group">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" id="email" class="form-control" th:field="*{email}" placeholder="claire@exemplo.com" required>
            </div>
            <div class="form-group">
              <label for="telefone" class="form-label">Telefone / WhatsApp</label>
              <input type="tel" id="telefone" class="form-control" th:field="*{telefone}"
                placeholder="(11) 99999-9999">
            </div>
            <div class="form-group">
              <label for="endereco" class="form-label">Endereço Completo (para Delivery)</label>
              <input type="text" id="endereco" class="form-control" th:field="*{endereco}" placeholder="Rua, número, complemento e bairro">
            </div>
            <div class="form-group">
              <label for="senha" class="form-label">Senha (mínimo 4 caracteres)</label>
              <input type="password" id="senha" class="form-control" th:field="*{senha}" minlength="4" required>
            </div>
            <div class="form-group">
              <label for="confirmarSenha" class="form-label">Confirmar Senha</label>
              <input type="password" id="confirmarSenha" class="form-control" th:field="*{confirmarSenha}" minlength="4" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1.1rem;">Criar Minha Conta</button>
          </form>
          <p style="text-align: center; margin-top: 1.5rem;">
            Já possui uma conta? <a th:href="@{/login}" style="color: var(--color-forest); font-weight: 700;">Entrar</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer th:replace="~{fragments :: footer}"></footer>
  <th:block th:replace="~{fragments :: scripts}"></th:block>
</body>

</html>
