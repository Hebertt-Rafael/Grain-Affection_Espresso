spring.application.name=espresso

# Se MySQL estiver rodando com credenciais, pode ser usado via variáveis DB_USER e DB_PASSWORD.
# Por padrão, utilizamos H2 persistente em arquivo para garantir funcionamento imediato em qualquer máquina sem erro de senha.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/espresso;AUTO_SERVER=TRUE;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (Acesse em http://localhost/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# Servidor Web (Acessível diretamente em http://localhost)
server.address=localhost
server.port=80
server.servlet.context-path=/
